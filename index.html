<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="网约车路况">
  <meta name="theme-color" content="#3388FF">
  <title>网约车路况</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 地图容器 -->
  <div id="map-container"></div>

  <!-- 首页搜索栏（胶囊悬浮） -->
  <div id="home-search" class="home-search">
    <span class="search-icon">🔍</span>
    <span class="search-placeholder">查目的地</span>
  </div>

  <!-- 路况始终优先：用低干扰底图突出红黄绿道路 -->
  <div class="traffic-focus" aria-live="polite">
    <span class="traffic-focus-dot"></span>
    <span>实时路况优先显示</span>
    <span id="traffic-focus-hint" class="traffic-focus-hint">红色 = 拥堵</span>
  </div>

  <!-- 网约车常用目的地，单手即可从当前位置规划驾车路线 -->
  <section class="driver-shortcuts" aria-label="常用目的地">
    <div class="driver-shortcuts-title">从当前位置出发</div>
    <div class="driver-shortcuts-grid">
      <button class="driver-shortcut" data-destination="福州火车站" data-display-name="福州站">
        <span class="driver-shortcut-main">福州站</span>
        <span class="driver-shortcut-sub">查看实时路况</span>
      </button>
      <button class="driver-shortcut" data-destination="福州南站" data-display-name="福州南站">
        <span class="driver-shortcut-main">福州南站</span>
        <span class="driver-shortcut-sub">查看实时路况</span>
      </button>
    </div>
  </section>

  <!-- 右下角浮动按钮 -->
  <div class="float-btns">
    <button id="traffic-btn" class="btn-float active" title="刷新路况" aria-label="刷新路况">🚦</button>
    <button id="locate-btn" class="btn-float" title="定位">📍</button>
    <button id="settings-btn" class="btn-float btn-settings" title="地图设置" aria-label="地图设置">⚙</button>
  </div>

  <!-- 搜索页面（全屏） -->
  <div id="search-page" class="search-page hidden">
    <div class="search-page-top">
      <button id="search-back" class="search-back">←</button>
      <input type="text" id="search-input" placeholder="搜索目的地" autocomplete="off">
      <button id="search-clear-input" class="search-clear-input hidden">✕</button>
    </div>
    <div id="search-body" class="search-body"></div>
  </div>

  <!-- 路线选择浮层：地图保持全屏可见，顶部和底部承载路线选择 -->
  <div id="route-page" class="route-page hidden">
    <!-- 顶部起终点 -->
    <div class="route-top">
      <button id="route-back" class="route-back">←</button>
      <div class="route-endpoints">
        <div class="endpoint-row">
          <span class="dot dot-start"></span>
          <span id="route-start-text" class="endpoint-text">我的位置</span>
        </div>
        <div class="endpoint-row">
          <span class="dot dot-end"></span>
          <span id="route-end-text" class="endpoint-text">终点</span>
        </div>
        <button id="swap-btn" class="swap-btn">⇅</button>
        </div>
        <!-- 网约车只保留驾车，不让无关方式分走注意力 -->
        <div class="route-modes">
          <label class="route-mode active" data-mode="driving">🚗 驾车</label>
        </div>
      </div>
    <!-- 只显示路线方案，不显示时间、距离和导航按钮 -->
    <div id="route-bottom" class="route-bottom">
      <div class="route-loading" id="route-loading">正在规划路线...</div>
      <div id="route-cards" class="route-cards-list"></div>
    </div>
  </div>

  <!-- Key 配置弹窗 -->
  <div id="key-modal" class="modal hidden">
    <div class="modal-content">
      <h2>配置高德地图 Key</h2>
      <p>地图使用 JS API Key。缩小时的城区单线路况已由 Cloudflare 安全处理，不需要再填第二把 Key。</p>
      <div class="key-input-group">
        <input type="text" id="key-input" placeholder="高德 JS API Key">
      </div>
      <div class="key-input-group">
        <input type="text" id="security-input" placeholder="安全密钥（可选）">
      </div>
      <button id="save-key" class="btn-primary btn-full">保存并加载</button>
      <p id="key-error" class="error-text"></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
